name: Build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Open Graph and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify event Open Graph images
        run: pnpm verify:og

      - name: Build application
        run: pnpm build

  deploy:
    name: Deploy to Coolify
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COOLIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$COOLIFY_DEPLOY_WEBHOOK" || -z "$COOLIFY_TOKEN" ]]; then
            echo "::error::Set COOLIFY_DEPLOY_WEBHOOK and COOLIFY_TOKEN repository secrets to deploy."
            exit 1
          fi
          curl --fail --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "$COOLIFY_DEPLOY_WEBHOOK"
